<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Source Han Sans CN";font-weight:500;src:url("../../素材/字体/SourceHanSansCN-Medium.otf")}
@font-face{font-family:"Source Han Sans CN";font-weight:600 700;src:url("../../素材/字体/SourceHanSansCN-Bold.otf")}
@font-face{font-family:"Source Han Sans CN";font-weight:800 900;src:url("../../素材/字体/SourceHanSansCN-Heavy.otf")}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { renderFrame, cues, MUSIC_AUTOMATION, DURATION } from './scenes.js';
import { LAYOUTS } from './layout.js';
const ar = new URLSearchParams(location.search).get('ar') || '16x9';
const L = LAYOUTS[ar];
const cv = document.getElementById('c');
cv.width = L.W; cv.height = L.H;
const ctx = cv.getContext('2d');
window.ready = (async () => {
  await Promise.all([500, 700, 900].map(w => document.fonts.load(`${w} 40px "Source Han Sans CN"`, '没事字')));
  return true;
})();
window.renderAt = t => { renderFrame(ctx, t, L); };
window.grab = (type = 'image/png', q) => cv.toDataURL(type, q);
window.cues = cues; window.MUSIC_AUTOMATION = MUSIC_AUTOMATION; window.DURATION = DURATION;
// 直接用浏览器打开时：?t=3.5 看某一帧，或者不带参数就实时播放
const qt = new URLSearchParams(location.search).get('t');
window.ready.then(() => {
  if (qt !== null) renderFrame(ctx, parseFloat(qt), L);
  else if (!navigator.webdriver) { const t0 = performance.now(); const loop = () => { renderFrame(ctx, (performance.now() - t0) / 1000, L); requestAnimationFrame(loop); }; loop(); }
});
</script></body></html>
